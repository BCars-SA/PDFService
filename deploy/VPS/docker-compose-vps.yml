services:
  # PDF Service
  pdf-service-api:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: production
    image: ghcr.io/bcars-sa/pdf-service-api:latest
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pdf-service-network
    deploy:
      resources:
        limits: # Set resource limits
          memory: 1G       
          cpus: '2.0'  # the biggest for pdf-service-api main service   
        reservations: # Ensure minimum resources
          memory: 512M
          cpus: '0.5'


  # Nginx reverse proxy
  nginx:
    image: ghcr.io/bcars-sa/pdf-service-nginx:latest
    restart: unless-stopped
    depends_on:
      pdf-service-api:
        condition: service_healthy
    # Increase file descriptor limits for high concurrency
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "83:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pdf-service-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 32M
          cpus: '0.05'

